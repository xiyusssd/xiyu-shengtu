name: Release

# 推 tag v* 时自动打包三平台并上传到 GitHub Releases
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          - runner: macos-13
            target: x86_64-apple-darwin
            platform: darwin-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install deps
        # --ignore-scripts 跳过所有 postinstall；esbuild/sharp/lightningcss 的原生二进制走 optionalDependencies，无需构建脚本
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build & bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          cd apps/desktop
          # 用 npm 版 tauri CLI（@tauri-apps/cli），无需 cargo install
          # beforeBuildCommand 会自动跑 tsc + vite build
          pnpm exec tauri build --target ${{ matrix.target }}

      - name: Ad-hoc codesign (macOS)
        if: startsWith(matrix.runner, 'macos')
        run: |
          codesign --sign - --force --deep --options runtime \
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/xiyu-shengtu.app

      - name: Upload macOS artifacts
        if: startsWith(matrix.runner, 'macos')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload Windows artifacts
        if: matrix.runner == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig

      - name: Upload Linux artifacts
        if: matrix.runner == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

  publish-latest-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate & upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          mkdir -p out
          gh release download "$TAG" --pattern "*.sig" --dir out
          REPO="${GITHUB_REPOSITORY}"

          # Tauri v2 updater 签名文件名：
          #   macOS  → xiyu-shengtu.app.tar.gz.sig
          #   Windows→ *_x64_en-US.msi.sig（直接签 .msi）
          #   Linux  → *_amd64.AppImage.sig（直接签 .AppImage）
          SIG_MAC_ARM=$(ls out/*aarch64*.app.tar.gz.sig 2>/dev/null | head -1)
          SIG_MAC_X64=$(ls out/*x86_64*.app.tar.gz.sig 2>/dev/null | head -1)
          SIG_WIN=$(ls out/*.msi.sig 2>/dev/null | head -1)
          SIG_LIN=$(ls out/*.AppImage.sig 2>/dev/null | head -1)

          # 只把有签名的平台写进 platforms（避免空 signature 让 updater 报错）
          PLATFORMS=""
          add_platform() {
            local key="$1" sigfile="$2" url="$3"
            [ -z "$sigfile" ] || [ ! -f "$sigfile" ] && return
            local sig; sig=$(tr -d '\n' < "$sigfile")
            [ -z "$sig" ] && return
            [ -n "$PLATFORMS" ] && PLATFORMS="$PLATFORMS,"
            PLATFORMS="$PLATFORMS\"$key\":{\"signature\":\"$sig\",\"url\":\"$url\"}"
          }
          add_platform "darwin-aarch64" "$SIG_MAC_ARM" "https://github.com/$REPO/releases/download/$TAG/xiyu-shengtu.app.tar.gz"
          add_platform "darwin-x86_64"  "$SIG_MAC_X64" "https://github.com/$REPO/releases/download/$TAG/xiyu-shengtu.app.tar.gz"
          add_platform "windows-x86_64" "$SIG_WIN" "https://github.com/$REPO/releases/download/$TAG/xiyu-shengtu_${VERSION}_x64_en-US.msi"
          add_platform "linux-x86_64"   "$SIG_LIN" "https://github.com/$REPO/releases/download/$TAG/xiyu-shengtu_${VERSION}_amd64.AppImage"

          cat > latest.json << JSON
          {
            "version": "$VERSION",
            "notes": "See https://github.com/$REPO/releases/tag/$TAG",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": { $PLATFORMS }
          }
          JSON
          echo "--- latest.json ---"; cat latest.json

          gh release upload "$TAG" latest.json --clobber
