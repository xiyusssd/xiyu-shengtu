name: Release

# 推 tag v* 时自动打包三平台并上传到 GitHub Releases
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          - runner: macos-13
            target: x86_64-apple-darwin
            platform: darwin-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install deps
        # --ignore-scripts 跳过所有 postinstall；esbuild/sharp/lightningcss 的原生二进制走 optionalDependencies，无需构建脚本
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build & bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          cd apps/desktop
          pnpm exec vite build
          cd src-tauri
          cargo tauri build --target ${{ matrix.target }}

      - name: Ad-hoc codesign (macOS)
        if: startsWith(matrix.runner, 'macos')
        run: |
          codesign --sign - --force --deep --options runtime \
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/xiyu-shengtu.app

      - name: Upload macOS artifacts
        if: startsWith(matrix.runner, 'macos')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload Windows artifacts
        if: matrix.runner == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.zip
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.zip.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Upload Linux artifacts
        if: matrix.runner == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

  publish-latest-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate & upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          mkdir -p out
          gh release download "$TAG" --pattern "*.sig" --dir out
          REPO="${GITHUB_REPOSITORY}"

          read_sig() {
            [ -f "$1" ] && tr -d '\n' < "$1" || echo ""
          }
          SIG_MAC_ARM=$(ls out/*aarch64*.app.tar.gz.sig 2>/dev/null | head -1)
          SIG_MAC_X64=$(ls out/*x86_64*.app.tar.gz.sig 2>/dev/null | head -1)
          SIG_WIN=$(ls out/*.msi.zip.sig 2>/dev/null | head -1)
          SIG_LIN=$(ls out/*.AppImage.tar.gz.sig 2>/dev/null | head -1)

          cat > latest.json << JSON
          {
            "version": "$VERSION",
            "notes": "See https://github.com/$REPO/releases/tag/$TAG",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$(read_sig "$SIG_MAC_ARM")",
                "url": "https://github.com/$REPO/releases/download/$TAG/xiyu-shengtu.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "$(read_sig "$SIG_MAC_X64")",
                "url": "https://github.com/$REPO/releases/download/$TAG/xiyu-shengtu.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "$(read_sig "$SIG_WIN")",
                "url": "https://github.com/$REPO/releases/download/$TAG/xiyu-shengtu_${VERSION}_x64_en-US.msi.zip"
              },
              "linux-x86_64": {
                "signature": "$(read_sig "$SIG_LIN")",
                "url": "https://github.com/$REPO/releases/download/$TAG/xiyu-shengtu_${VERSION}_amd64.AppImage.tar.gz"
              }
            }
          }
          JSON

          gh release upload "$TAG" latest.json --clobber
